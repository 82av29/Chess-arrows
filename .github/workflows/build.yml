name: Build Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Create Flutter project
        run: flutter create --org com.chessarrows temp_project

      - name: Copy our source files
        run: |
          cp lib/*.dart temp_project/lib/
          cp pubspec.yaml temp_project/pubspec.yaml
          cp android/app/src/main/AndroidManifest.xml temp_project/android/app/src/main/AndroidManifest.xml
          cp android/app/src/main/res/values/styles.xml temp_project/android/app/src/main/res/values/styles.xml

      - name: Get dependencies
        working-directory: temp_project
        run: flutter pub get

      - name: Build debug APK
        working-directory: temp_project
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: chess-arrows-debug
          path: temp_project/build/app/outputs/flutter-apk/app-debug.apk

      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: temp_project/build/app/outputs/flutter-apk/app-debug.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
